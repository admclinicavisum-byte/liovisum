<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Estoque — Visum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    --bg: #f6f7f3;
    --surface: #ffffff;
    --surface-2: #eef1ea;
    --ink: #1c231f;
    --ink-soft: #57625a;
    --line: #d9ddd2;
    --ok-bg: #eaf3ec; --ok-ink: #2e5a44; --ok-line: #cfe6d7;
    --warn-bg: #fdf1dd; --warn-ink: #8a5a12; --warn-line: #eec988;
    --bad-bg: #fbe9e7; --bad-ink: #96271d; --bad-line: #eeb3ac;
  }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }

  header.top {
    background: #fefefe;
    border-bottom: 2px solid #294f96;
    padding: 14px 20px calc(14px + env(safe-area-inset-top, 0px));
  }
  header.top .inner {
    max-width: 1080px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
  }
  header.top .brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
  header.top .logo { height: 46px; width: auto; display: block; flex-shrink: 0; }
  h1 {
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 600; font-size: 1.3rem; margin: 0; letter-spacing: -0.01em;
    color: #22304a;
  }
  .subtitle { color: #6b4c46; font-size: 0.88rem; margin-top: 2px; }

  .refresh-line {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    font-size: 0.82rem; color: #6b4c46;
  }
  .refresh-btn {
    background: #294f96; color: #fff; border: none; border-radius: 6px;
    padding: 6px 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
  }
  .refresh-btn:hover { opacity: .88; }
  .refresh-btn:disabled { opacity: .5; cursor: default; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #294f96; flex-shrink: 0; display: inline-block; }
  .dot.err { background: var(--bad-ink); }
  .dot.loading { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }

  .banner {
    border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; margin-bottom: 20px;
    border: 1px solid var(--bad-line); background: var(--bad-bg); color: var(--bad-ink);
  }
  .banner a { color: inherit; font-weight: 600; text-decoration: underline; }

  .summary {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1px; background: var(--line); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; margin: 0 0 24px;
  }
  .summary .cell { background: var(--surface); padding: 16px 18px; }
  .summary .num { font-size: 1.6rem; font-weight: 600; line-height: 1.1; font-family: "Source Serif 4", Georgia, serif; }
  .summary .lbl { font-size: 0.8rem; color: var(--ink-soft); margin-top: 4px; }
  .summary .cell.warn .num { color: var(--warn-ink); }
  .summary .cell.bad .num { color: var(--bad-ink); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 {
    font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 1.05rem; margin: 0; color: var(--ink);
  }
  .totals-row { font-size: 0.85rem; color: var(--ink-soft); }
  .totals-row b { color: var(--ink); font-size: 1rem; font-weight: 600; }

  .lots { display: flex; flex-direction: column; gap: 6px; }
  .lot {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid transparent;
  }
  .lot.ok { background: var(--ok-bg); border-color: var(--ok-line); }
  .lot.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .lot.bad { background: var(--bad-bg); border-color: var(--bad-line); }
  .lot .left { font-size: 0.85rem; }
  .lot .qty { font-weight: 700; font-size: 0.95rem; white-space: nowrap; }
  .lot.ok .qty { color: var(--ok-ink); }
  .lot.warn .qty { color: var(--warn-ink); }
  .lot.bad .qty { color: var(--bad-ink); }
  .lot .status { font-size: 0.74rem; display: block; margin-top: 2px; }
  .lot.ok .status { color: var(--ok-ink); }
  .lot.warn .status { color: var(--warn-ink); }
  .lot.bad .status { color: var(--bad-ink); }
  .empty-lots { font-size: 0.85rem; color: var(--ink-soft); }

  .skeleton { opacity: .5; }
  .footer-note { margin-top: 28px; font-size: 0.78rem; color: var(--ink-soft); text-align: center; }

  @media (max-width: 480px) {
    header.top .logo { height: 36px; }
    h1 { font-size: 1.08rem; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <div class="brand">
      <img class="logo" id="logo-img" alt="Visum Oftalmologia">
      <div>
        <h1>Portal de Estoque — Medicamentos de Alto Custo</h1>
        <div class="subtitle">Somente leitura — dados vêm direto da planilha oficial</div>
      </div>
    </div>
    <div class="refresh-line">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Carregando...</span>
      <button class="refresh-btn" id="refresh-btn">Atualizar agora</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="banner-slot"></div>
  <div class="summary" id="summary"></div>
  <div class="grid" id="grid"></div>
  <div class="footer-note">Este portal não edita a planilha — para lançar quantidades e validades, edite direto no Google Sheets.</div>
</div>

  document.getElementById("logo-img").src = "data:image/jpeg;base64," + LOGO_B64;

  function csvUrl() {
    // Endpoint com CORS liberado para planilhas com acesso "Qualquer pessoa com o link".
    return "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&gid=" + ESTOQUE_GID + "&_=" + Date.now();
  }
  function csvUrlFallback() {
    return "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/export?format=csv&gid=" + ESTOQUE_GID + "&_=" + Date.now();
  }

  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else { field += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ',') { row.push(field); field = ""; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === '\r') { /* skip */ }
        else { field += c; }
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function parseDate(s) {
    // aceita DD/MM/YYYY
    if (!s) return null;
    var m = s.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    return new Date(parseInt(m[3], 10), parseInt(m[2], 10) - 1, parseInt(m[1], 10));
  }

  function todayMidnight() {
    var d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function daysUntil(date) {
    return Math.round((date - todayMidnight()) / 86400000);
  }

  function lotStatus(days) {
    if (days < 0) return "bad";
    if (days <= ALERT_DAYS) return "warn";
    return "ok";
  }

  function statusLabel(days) {
    if (days < 0) return "Vencido há " + Math.abs(days) + (Math.abs(days) === 1 ? " dia" : " dias");
    if (days === 0) return "Vence hoje";
    if (days <= ALERT_DAYS) return "Vence em " + days + (days === 1 ? " dia" : " dias");
    return "Validade ok";
  }

  function fmtDate(d) {
    var dd = String(d.getDate()).padStart(2, "0");
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    return dd + "/" + mm + "/" + d.getFullYear();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function rowsToMeds(rows) {
    // Espera cabeçalho: Medicamento | Validade | Quantidade | ...
    var meds = {};
    var order = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      var nome = (r[0] || "").trim();
      var validadeStr = (r[1] || "").trim();
      var qtdStr = (r[2] || "").trim();
      if (!nome) continue;
      var d = parseDate(validadeStr);
      var qtd = parseFloat(qtdStr.replace(",", "."));
      if (!meds[nome]) { meds[nome] = []; order.push(nome); }
      if (d && !isNaN(qtd)) {
        meds[nome].push({ date: d, qtd: qtd });
      }
    }
    return order.map(function (nome) { return { nome: nome, lotes: meds[nome] }; });
  }

  function render(meds) {
    var totalMeds = meds.length;
    var totalUnidades = 0, vencidos = 0, proximos = 0;
    meds.forEach(function (m) {
      m.lotes.forEach(function (l) {
        totalUnidades += l.qtd;
        var days = daysUntil(l.date);
        var s = lotStatus(days);
        if (s === "bad") vencidos++;
        else if (s === "warn") proximos++;
      });
    });

    var sEl = document.getElementById("summary");
    sEl.innerHTML =
      cell(totalMeds, "medicamentos cadastrados") +
      cell(totalUnidades.toLocaleString("pt-BR"), "unidades no estoque") +
      cell(proximos, "lotes vencendo em " + ALERT_DAYS + " dias", proximos > 0 ? "warn" : "") +
      cell(vencidos, "lotes vencidos", vencidos > 0 ? "bad" : "");

    var gEl = document.getElementById("grid");
    var html = "";
    meds.forEach(function (m) {
      var lotesOrdenados = m.lotes.slice().sort(function (a, b) { return a.date - b.date; });
      var total = lotesOrdenados.reduce(function (s, l) { return s + l.qtd; }, 0);
      var lotesHtml = lotesOrdenados.length
        ? lotesOrdenados.map(function (l) {
            var days = daysUntil(l.date);
            var status = lotStatus(days);
            return (
              '<div class="lot ' + status + '">' +
                '<div class="left">' + fmtDate(l.date) + '<span class="status">' + statusLabel(days) + '</span></div>' +
                '<div class="qty">' + l.qtd.toLocaleString("pt-BR") + '</div>' +
              '</div>'
            );
          }).join("")
        : '<div class="empty-lots">Nenhum lote com validade/quantidade preenchidas.</div>';

      html +=
        '<div class="card">' +
          '<h2>' + escapeHtml(m.nome) + '</h2>' +
          '<div class="totals-row"><b>' + total.toLocaleString("pt-BR") + '</b> unidades disponíveis em ' + lotesOrdenados.length + (lotesOrdenados.length === 1 ? ' lote' : ' lotes') + '</div>' +
          '<div class="lots">' + lotesHtml + '</div>' +
        '</div>';
    });
    gEl.innerHTML = html || '<div class="empty-lots">Nenhum medicamento encontrado na planilha.</div>';
  }

  function cell(num, lbl, cls) {
    return '<div class="cell ' + (cls || "") + '"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
  }

  function setStatus(mode, text) {
    document.getElementById("status-dot").className = "dot" + (mode ? " " + mode : "");
    document.getElementById("status-text").textContent = text;
  }

  function showError() {
    document.getElementById("banner-slot").innerHTML =
      '<div class="banner">Não foi possível carregar os dados da planilha agora. ' +
      'Verifique se o acesso está em "Qualquer pessoa com o link pode visualizar", ou ' +
      '<a href="' + SHEET_EDIT_URL + '" target="_blank" rel="noopener">abra a planilha diretamente</a> e clique em Atualizar novamente.</div>';
  }

  function clearError() {
    document.getElementById("banner-slot").innerHTML = "";
  }

  var loading = false;
  function load() {
    if (loading) return;
    loading = true;
    setStatus("loading", "Atualizando...");
    document.getElementById("refresh-btn").disabled = true;

    fetch(csvUrl(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("status " + r.status); return r.text(); })
      .catch(function () {
        return fetch(csvUrlFallback(), { cache: "no-store" }).then(function (r) {
          if (!r.ok) throw new Error("status " + r.status);
          return r.text();
        });
      })
      .then(function (text) {
        var rows = parseCSV(text);
        var meds = rowsToMeds(rows);
        render(meds);
        clearError();
        var now = new Date();
        setStatus(null, "Atualizado às " + String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0"));
      })
      .catch(function () {
        setStatus("err", "Falha ao atualizar");
        showError();
      })
      .finally(function () {
        loading = false;
        document.getElementById("refresh-btn").disabled = false;
      });
  }

  document.getElementById("refresh-btn").addEventListener("click", load);
  load();
  setInterval(load, AUTO_REFRESH_MS);
})();
</script>
